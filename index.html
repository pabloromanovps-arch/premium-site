<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Стебель — тестовый стенд</title>
  <meta name="description" content="Тестовый стенд цветочного магазина: сайт, бот в мессенджерах, CRM и пульт тестирования.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 30V14' stroke='%232f5d3a' stroke-width='3'/%3E%3Ccircle cx='16' cy='10' r='8' fill='%23d6336c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alice&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; background: var(--paper); }
    .stand-top {
      display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap;
      padding: 10px var(--gutter); background: var(--ink); color: var(--white);
    }
    .stand-top .logo { font-family: var(--display); font-size: 1.5rem; line-height: 1; }
    .stand-top .logo span { font-family: var(--text); font-size: .85rem; font-weight: 600; color: #cdbfd6; margin-left: 6px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
    .tabs a { color: #eadff0; text-decoration: none; font-weight: 600; padding: 8px 12px; border-radius: 8px; }
    .tabs a:hover { background: rgba(255, 255, 255, .1); color: var(--white); }
    .tabs a[aria-current="page"] { background: var(--white); color: var(--ink); }
    .sync { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: .85rem; color: #eadff0; max-width: 46ch; }
    .sync::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: #9a8ca3; }
    .sync[data-state="shared"]::before { background: #6fd08c; }
    .sync[data-state="readonly"]::before, .sync[data-state="full"]::before { background: #f0b44c; }
    .frame { flex: 1; width: 100%; border: 0; display: block; background: var(--paper); }
    @media (max-width: 760px) {
      .stand-top { padding: 8px 12px; }
      .tabs { order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap; }
      .tabs a { white-space: nowrap; padding: 7px 10px; }
      .sync { margin-left: auto; font-size: .78rem; }
    }
  </style>
</head>
<body>
  <header class="stand-top">
    <p class="logo">Стебель <span>тестовый стенд</span></p>
    <nav class="tabs" aria-label="Разделы стенда" id="tabs">
      <a href="#start" data-page="start.html">С чего начать</a>
      <a href="#shop" data-page="shop.html">Сайт</a>
      <a href="#channels" data-page="channels.html">Мессенджеры</a>
      <a href="#crm" data-page="crm.html">CRM</a>
      <a href="#lab" data-page="lab.html">Пульт</a>
    </nav>
    <p class="sync" id="sync" data-state="local" role="status">Подключаем общий режим…</p>
  </header>
  <iframe class="frame" id="frame" title="Раздел стенда"></iframe>

  <script>window.STEBEL_STAND = true;</script>
  <script src="js/sync.js"></script>
  <script src="js/stand.js"></script>
</body>
</html>
