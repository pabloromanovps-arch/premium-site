[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salesai"
version = "0.1.0"
description = "ИИ-ассистент продаж и симулятор покупателей"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["salesai*"]

[tool.setuptools.package-data]
"salesai.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
